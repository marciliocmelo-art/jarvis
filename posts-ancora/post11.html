<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Lora'; src: url('/usr/share/fonts/truetype/google-fonts/Lora-Variable.ttf'); font-weight: 400 700; }
  @font-face { font-family: 'Poppins'; src: url('/usr/share/fonts/truetype/google-fonts/Poppins-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Poppins'; src: url('/usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Poppins'; src: url('/usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf'); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; position: relative; overflow: hidden; font-family: 'Poppins', sans-serif; background: #faf3e6; }
  .bg { position: absolute; top: 0; left: 0; width: 1080px; height: 620px; object-fit: cover; }
  .shade-top { position: absolute; top: 0; left: 0; width: 1080px; height: 620px; background: linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.05) 50%, rgba(250,243,230,0) 75%, #faf3e6 100%); }
  .card { position: absolute; top: 560px; left: 0; width: 1080px; height: 790px; background: #faf3e6; border-radius: 48px 48px 0 0; }
  .header { position: absolute; top: 60px; left: 0; width: 1080px; text-align: center; color: #fbeed8; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 31px; letter-spacing: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.35); }
  .verse-tag { position: absolute; top: 650px; left: 0; width: 1080px; text-align: center; color: #b8863c; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 3px; }
  .hook { position: absolute; top: 720px; left: 70px; width: 940px; text-align: center; color: #2b2420; font-family: 'Lora', serif; font-weight: 600; font-size: 62px; line-height: 1.22; }
  .hook .accent { color: #c8912f; }
  .divider { position: absolute; top: 1010px; left: 440px; width: 200px; height: 2px; background: rgba(200,145,47,0.6); }
  .subtext { position: absolute; top: 1040px; left: 100px; width: 880px; text-align: center; color: #5a4f42; font-family: 'Poppins', sans-serif; font-weight: 400; font-size: 29px; line-height: 1.5; }
  .cta { position: absolute; top: 1195px; left: 200px; width: 680px; text-align: center; border: 2px solid #c8912f; border-radius: 40px; padding: 18px 0; color: #b8863c; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 29px; }
  .handle { position: absolute; bottom: 30px; left: 0; width: 1080px; text-align: center; color: rgba(90,79,66,0.6); font-family: 'Poppins', sans-serif; font-weight: 400; font-size: 24px; letter-spacing: 2px; }
</style>
</head>
<body>
  <img class="bg" src="bg-gratidao.png">
  <div class="shade-top"></div>
  <div class="card"></div>
  <div class="header">✝ ÂNCORA DA ALMA ✝</div>
  <div class="verse-tag">FILIPENSES 4:6</div>
  <div class="hook">Ela parou de pedir<br>e começou a<br><span class="accent">agradecer. Tudo mudou.</span></div>
  <div class="divider"></div>
  <div class="subtext">Paulo escreveu isso preso em Roma, sem saber se sairia vivo. Mesmo assim, ensinou: troque a ansiedade pela gratidão na oração.</div>
  <div class="cta">Comece a orar agradecendo hoje</div>
  <div class="handle">@ancoradealma</div>
</body>
</html>
