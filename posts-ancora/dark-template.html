<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Lora'; src: url('/usr/share/fonts/truetype/google-fonts/Lora-Variable.ttf'); font-weight: 400 700; }
  @font-face { font-family: 'Poppins'; src: url('/usr/share/fonts/truetype/google-fonts/Poppins-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Poppins'; src: url('/usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Poppins'; src: url('/usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf'); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; position: relative; overflow: hidden; font-family: 'Poppins', sans-serif; background: #0d0b08; }
  .bg { position: absolute; top: 0; left: 0; width: 1080px; height: 1350px; object-fit: cover; }
  .shade-top { position: absolute; top: 0; left: 0; width: 1080px; height: 900px; background: linear-gradient(to bottom, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.15) 100%); }
  .shade-bottom { position: absolute; bottom: 0; left: 0; width: 1080px; height: 460px; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0) 100%); }
  .frame { position: absolute; top: 36px; left: 36px; right: 36px; bottom: 36px; border: 1.5px solid rgba(216,178,94,0.55); pointer-events: none; }
  .header { position: absolute; top: 60px; left: 0; width: 1080px; text-align: center; color: #d8b25e; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 31px; letter-spacing: 6px; }
  .badge { position: absolute; top: 130px; left: 0; width: 1080px; text-align: center; color: #d8b25e; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 3px; }
  .verse-tag { position: absolute; top: 650px; left: 0; width: 1080px; text-align: center; color: #d8b25e; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 3px; }
  .hook { position: absolute; top: 720px; left: 70px; width: 940px; text-align: center; color: #f7ecd9; font-family: 'Lora', serif; font-weight: 600; font-size: 62px; line-height: 1.22; }
  .hook .accent { color: #d8b25e; }
  .divider { position: absolute; top: 1010px; left: 440px; width: 200px; height: 2px; background: rgba(216,178,94,0.6); }
  .subtext { position: absolute; top: 1040px; left: 100px; width: 880px; text-align: center; color: #e4d9c4; font-family: 'Poppins', sans-serif; font-weight: 300; font-size: 29px; line-height: 1.5; }
  .cta { position: absolute; top: 1195px; left: 200px; width: 680px; text-align: center; border: 2px solid #d8b25e; border-radius: 40px; padding: 18px 0; color: #d8b25e; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 29px; }
  .handle { position: absolute; bottom: 30px; left: 0; width: 1080px; text-align: center; color: rgba(216,178,94,0.55); font-family: 'Poppins', sans-serif; font-weight: 400; font-size: 24px; letter-spacing: 2px; }
</style>
</head>
<body>
  <img class="bg" src="BGFILE">
  <div class="shade-top"></div>
  <div class="shade-bottom"></div>
  <div class="frame"></div>
  <div class="header">✝ ÂNCORA DA ALMA ✝</div>
  <div class="verse-tag">VERSETAG</div>
  <div class="hook">HOOKTEXT</div>
  <div class="divider"></div>
  <div class="subtext">SUBTEXT</div>
  <div class="cta">CTATEXT</div>
  <div class="handle">@ancoradealma</div>
</body>
</html>
